[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyosutil"
version = "0.1.0"
description = "Windows utility toolkit CLI (copy files/folders across drives with resume)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
pyosutil = "pyosutil:main"

[tool.setuptools]
py-modules = ["pyosutil"]